[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoqc"
version = "0.0.3"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2", "scipy>=1.15,<1.16", "pydantic>=2.12,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "hypothesis>=6,<7", "ruff>=0.16,<0.17", "mypy>=2.4,<2.5", "types-PyYAML>=6,<7"]
reference = ["disba>=0.7,<0.8", "obspy>=1.5,<1.6", "pytest-cov>=7.1,<8", "coverage>=7.15,<8"]

[project.scripts]
geoqc = "geoqc.cli:main"

[tool.setuptools.packages.find]
include = ["geoqc*"]

[tool.setuptools.package-data]
geoqc = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]
markers = ["req(id): requisito histórico del SDD", "vid(id): obligación de validación v1.4", "rm(id, criterion): criterio del suplemento MASW-R1"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["geoqc"]

[[tool.mypy.overrides]]
module = ["scipy.*", "disba.*"]
ignore_missing_imports = true
